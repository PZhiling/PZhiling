# Cloudflare Workers configuration (static assets only).
#
# The site under docs/ is prebuilt static HTML — the same directory GitHub
# Pages serves — so there is no build step. Leave the build command empty in
# the Cloudflare dashboard; running `npm run build` would produce dist/ (the
# Vite app), which is not what is published here.
#
# There is no `main` entry point on purpose: this is an assets-only Worker,
# so `npx wrangler deploy` uploads docs/ and serves it directly.
name = "podcast-seo-studio"
compatibility_date = "2026-08-06"

[assets]
directory = "./docs"
